tools:
- name: create_layer
  description: Create a new pixel, group, or adjustment layer in the active document.
  source_file: scripts/create_layer.py
  execution: sync
  read_only: false
  destructive: false
  idempotent: false
  input_schema:
    type: object
    properties:
      name:
        type: string
        description: Layer name (default "Layer").
        default: Layer
      layer_type:
        type: string
        description: '"pixel" (default) or "group".'
        default: pixel
    additionalProperties: false
- name: delete_layer
  description: Delete a named layer from the active document.
  source_file: scripts/delete_layer.py
  execution: sync
  read_only: false
  destructive: true
  idempotent: false
  input_schema:
    type: object
    properties:
      name:
        type: string
        description: Exact name of the layer to delete.
    additionalProperties: false
    required:
    - name
- name: duplicate_layer
  description: Duplicate a named layer, optionally giving the duplicate a new name.
  source_file: scripts/duplicate_layer.py
  execution: sync
  read_only: false
  destructive: false
  idempotent: false
  input_schema:
    type: object
    properties:
      name:
        type: string
        description: Exact name of the source layer.
      new_name:
        type: string
        description: Optional name for the duplicate; if omitted Photoshop appends " copy" automatically.
        default: ''
    additionalProperties: false
    required:
    - name
- name: rename_layer
  description: Rename a layer in the active document.
  source_file: scripts/rename_layer.py
  execution: sync
  read_only: false
  destructive: false
  idempotent: true
  input_schema:
    type: object
    properties:
      name:
        type: string
        description: Current name of the layer.
      new_name:
        type: string
        description: New name to assign.
    additionalProperties: false
    required:
    - name
    - new_name
- name: set_layer_opacity
  description: Set the opacity (0-100) of a named layer.
  source_file: scripts/set_layer_opacity.py
  execution: sync
  read_only: false
  destructive: false
  idempotent: true
  input_schema:
    type: object
    properties:
      name:
        type: string
        description: Exact layer name.
      opacity:
        type: number
        description: Opacity value 0 (transparent) to 100 (opaque).
      verify:
        type: boolean
        description: Measure how much the layer actually changes the composite after the
          change and report ``effect.no_op``. Enabled by default; set ``false`` to skip
          the read-back for large batches.
        default: true
      per_axis:
        type: integer
        description: Composite sample points per axis inside the layer bounds (``per_axis **
          2`` samples in total) used when ``verify`` is enabled.
        default: 3
      tolerance:
        type: number
        description: Largest per-channel composite delta (0-255) still reported as invisible.
        default: 1.0
    additionalProperties: false
    required:
    - name
    - opacity
- name: set_layer_visibility
  description: Show or hide a named layer.
  source_file: scripts/set_layer_visibility.py
  execution: sync
  read_only: false
  destructive: false
  idempotent: true
  input_schema:
    type: object
    properties:
      name:
        type: string
        description: Exact layer name.
      visible:
        type: boolean
        description: '``True`` to show, ``False`` to hide.'
    additionalProperties: false
    required:
    - name
    - visible
- name: set_layer_blend_mode
  description: Set the blend mode of a named layer (normal, multiply, screen, overlay, etc.).
  source_file: scripts/set_layer_blend_mode.py
  execution: sync
  read_only: false
  destructive: false
  idempotent: true
  input_schema:
    type: object
    properties:
      name:
        type: string
        description: Exact layer name.
      blend_mode:
        type: string
        description: Blend mode string, e.g. ``"multiply"``, ``"screen"``, ``"overlay"``, ``"soft_light"``, ``"normal"``.
      verify:
        type: boolean
        description: Measure how much the layer actually changes the composite after the
          change and report ``effect.no_op``. Blend modes such as ``overlay`` over a white
          backdrop are mathematical no-ops, so this is enabled by default; set ``false``
          to skip the read-back for large batches.
        default: true
      per_axis:
        type: integer
        description: Composite sample points per axis inside the layer bounds (``per_axis **
          2`` samples in total) used when ``verify`` is enabled.
        default: 3
      tolerance:
        type: number
        description: Largest per-channel composite delta (0-255) still reported as invisible.
        default: 1.0
    additionalProperties: false
    required:
    - name
    - blend_mode
- name: verify_layer_batch
  description: >-
    Report which layers contribute nothing to the composite. Hides each layer in turn, samples
    the composite inside its bounds, then shows it again, and flags every layer whose contribution
    is zero — this catches silent no-ops such as an ``overlay`` blend mode over a solid white
    backdrop, a hidden layer, or zero opacity, none of which raise an error on their own. The probe
    toggles layer visibility while it runs and reports ``unrestored_layers`` if any layer could not
    be shown again.
  source_file: scripts/verify_layer_batch.py
  execution: sync
  read_only: false
  destructive: false
  idempotent: true
  input_schema:
    type: object
    properties:
      layers:
        type: array
        description: Layer names to check. Defaults to every top-level layer of the active
          document.
        items:
          type: string
      per_axis:
        type: integer
        description: Composite sample points per axis inside each layer bounds (``per_axis **
          2`` samples in total).
        default: 3
      tolerance:
        type: number
        description: Largest per-channel composite delta (0-255) still reported as invisible.
        default: 1.0
    additionalProperties: false
- name: fill_layer
  description: Fill a layer with a solid color (hex or RGB) or transparent.
  source_file: scripts/fill_layer.py
  execution: sync
  read_only: false
  destructive: false
  idempotent: true
  input_schema:
    type: object
    properties:
      name:
        type: string
        description: Exact layer name.
      color:
        type: string
        description: Fill color as a hex string (e.g. ``"#ff0000"`` for red) or ``"transparent"`` to clear.  Default is white
          ``"#ffffff"``.
        default: '#ffffff'
      opacity:
        type: number
        description: Fill opacity 0-100 (default 100).
        default: 100.0
    additionalProperties: false
    required:
    - name
