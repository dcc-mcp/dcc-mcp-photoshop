name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to rebuild artifacts for (e.g. v0.2.0). Leave empty to trigger release-please only."
        required: false
        default: ""
      release_version:
        description: "Version for tag_name without the v prefix (e.g. 0.2.0). Required when tag_name is set."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ github.event_name == 'workflow_dispatch' && inputs.tag_name && format('-{0}', inputs.tag_name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  decide:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    permissions: {}
    outputs:
      tag_name: ${{ steps.decide.outputs.tag_name }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Validate and resolve version info
        id: decide
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$TAG_NAME"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag_name must be a final vX.Y.Z tag"
            exit 1
          fi
          VER="$RELEASE_VERSION"
          if [ -z "$VER" ]; then
            VER="${TAG#v}"
          fi
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::tag_name and release_version must identify the same release"
            exit 1
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  validate-release-version:
    needs: [decide]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.decide.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate release version and lock contract
        env:
          RELEASE_VERSION: ${{ needs.decide.outputs.version }}
        shell: python
        run: |
          import os
          import sys
          import tomllib
          from pathlib import Path

          release_version = os.environ["RELEASE_VERSION"]
          project_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if project_version != release_version:
              print(f"::error::pyproject.toml version {project_version} does not match release {release_version}")
              sys.exit(1)
      - run: python scripts/ci/check_uv_lock.py

  verify-release-source:
    needs: [decide, validate-release-version]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.decide.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the tag and GitHub Release to one source commit
        id: source
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.decide.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          TAG_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.type')
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')
          if [ "$TAG_TYPE" != "commit" ] || [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::refs/tags/$TAG_NAME does not resolve directly to the checked-out source"
            exit 1
          fi
          RELEASE_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.target_commitish')
          if [ "$RELEASE_TARGET" != "$SOURCE_SHA" ]; then
            echo "::error::release target does not match tag source"
            exit 1
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-binary:
    needs: [decide, validate-release-version, verify-release-source]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dcc-mcp-photoshop-windows
            binary_name: dcc-mcp-photoshop.exe
          - os: ubuntu-latest
            artifact: dcc-mcp-photoshop-linux
            binary_name: dcc-mcp-photoshop
          - os: macos-latest
            artifact: dcc-mcp-photoshop-macos
            binary_name: dcc-mcp-photoshop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.decide.outputs.tag_name }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Bind build to verified source
        env:
          VERIFIED_SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SOURCE_SHA"
      - name: Smoke test CLI entry point
        run: dcc-mcp-photoshop --version
      - name: Build standalone binary
        run: python tools/build_binary.py
      - name: Smoke test standalone binary
        shell: bash
        run: |
          set -euo pipefail
          cd dist/binary
          test -f "${{ matrix.binary_name }}"
          "./${{ matrix.binary_name }}" --version
          "./${{ matrix.binary_name }}" --help
          printf '%s' '{"message":"standalone"}' | \
            "./${{ matrix.binary_name }}" \
            "$GITHUB_WORKSPACE/tools/standalone_skill_smoke.py" \
            --message standalone
      - name: Package standalone archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/archive
          tar -C dist/binary -czf "dist/archive/${{ matrix.artifact }}.tar.gz" .
      - name: Upload immutable standalone archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-${{ needs.decide.outputs.version }}-${{ github.run_id }}
          path: dist/archive/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    name: Build wheel and sdist once
    needs: [decide, validate-release-version, verify-release-source]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      artifact_id: ${{ steps.upload-dist.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-dist.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.decide.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind build to verified source
        id: source
        env:
          VERIFIED_SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          test "$SOURCE_SHA" = "$VERIFIED_SOURCE_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Install build and test dependencies
        run: pip install -e ".[dev]"
      - name: Verify resolver and test suite
        run: |
          python -m pip check
          python scripts/ci/check_installed_dependencies.py
          pytest tests/ -v --tb=short
      - name: Build wheel and sdist
        run: python -m build
      - name: Require one wheel and one sdist
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Upload immutable Python distributions
        id: upload-dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist-${{ needs.decide.outputs.version }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Record immutable build receipt
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARTIFACT_ID: ${{ steps.upload-dist.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-dist.outputs.artifact-digest }}
        run: |
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [decide, validate-release-version, verify-release-source, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-photoshop
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download immutable Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
      - name: Verify immutable artifact identity
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.decide.outputs.tag_name }}
          BUILD_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          VERIFIED_SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_SOURCE_SHA" = "$VERIFIED_SOURCE_SHA"
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          TAG_SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')
          RELEASE_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.target_commitish')
          test "$TAG_SOURCE" = "$VERIFIED_SOURCE_SHA"
          test "$RELEASE_TARGET" = "$VERIFIED_SOURCE_SHA"
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true

  attach-release-assets:
    needs: [decide, validate-release-version, verify-release-source, build, build-binary]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download immutable Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-assets
      - name: Download Windows standalone archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dcc-mcp-photoshop-windows-${{ needs.decide.outputs.version }}-${{ github.run_id }}
          path: release-assets
      - name: Download Linux standalone archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dcc-mcp-photoshop-linux-${{ needs.decide.outputs.version }}-${{ github.run_id }}
          path: release-assets
      - name: Download macOS standalone archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dcc-mcp-photoshop-macos-${{ needs.decide.outputs.version }}-${{ github.run_id }}
          path: release-assets
      - name: Verify immutable artifact identity
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.decide.outputs.tag_name }}
          BUILD_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          VERIFIED_SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_SOURCE_SHA" = "$VERIFIED_SOURCE_SHA"
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          TAG_SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')
          RELEASE_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.target_commitish')
          test "$TAG_SOURCE" = "$VERIFIED_SOURCE_SHA"
          test "$RELEASE_TARGET" = "$VERIFIED_SOURCE_SHA"
          test "$(find release-assets -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5
      - name: Attach assets without clobbering
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.decide.outputs.tag_name }}
          VERIFIED_SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.id')
          RELEASE_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.target_commitish')
          test "$TAG_SOURCE" = "$VERIFIED_SOURCE_SHA"
          test "$RELEASE_TARGET" = "$VERIFIED_SOURCE_SHA"
          EXISTING=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name')
          for asset in release-assets/*; do
            name=$(basename "$asset")
            if grep -Fqx "$name" <<< "$EXISTING"; then
              echo "::error::existing release asset refuses no-clobber publication: $name"
              exit 1
            fi
          done
          gh release upload "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY"
