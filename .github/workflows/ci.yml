name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install lifecycle contract smoke
        run: python -m pytest tests/test_install_lifecycle.py tests/test_install_docs.py -q

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest tests/ -v --tb=short --cov=src/dcc_mcp_photoshop --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  lint-skills:
    name: Lint Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Lint SKILL.md files
        run: python tools/lint_skills.py --error-only

  adobepy_cli_floor:
    name: adobepy CLI checksum floor
    runs-on: windows-latest
    env:
      ADOBEPY_VERSION: "0.6.2"
      ADOBEPY_ARCHIVE_SHA256: "9ef9abb5e034359f12e9ce248b0030e38d34c76df343eb2713f18036068719a7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install -e ".[dev]"

      - name: Verify official adobepy release bytes
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "adobepy-$env:ADOBEPY_VERSION-windows-x64.zip"
          $release = "https://github.com/dcc-mcp/adobepy/releases/download/adobepy-v$env:ADOBEPY_VERSION/adobepy-$env:ADOBEPY_VERSION-windows-x64.zip"
          Invoke-WebRequest -Uri $release -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ADOBEPY_ARCHIVE_SHA256) {
            throw "adobepy release archive digest mismatch"
          }
          $extract = Join-Path $env:RUNNER_TEMP "adobepy-release"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $env:DCC_MCP_PHOTOSHOP_ADOBEPY_FLOOR_CLI = Join-Path $extract "adobepy-$env:ADOBEPY_VERSION-windows-x64\bin\adobepy.exe"
          python -m pytest -q tests/test_install_lifecycle.py::test_declared_adobepy_floor_cli_matches_the_official_checksum_release

  cli-smoke:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Verify CLI entry point
        run: |
          dcc-mcp-photoshop --help
          python -m dcc_mcp_photoshop --help

      - name: Start server briefly and verify it responds
        run: |
          dcc-mcp-photoshop --mcp-port 0 &
          SERVER_PID=$!
          sleep 2
          kill $SERVER_PID 2>/dev/null || true
        continue-on-error: true

  ci-gate:
    name: CI Gate
    if: always()
    needs: [test, lint, lint-skills, adobepy_cli_floor, cli-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        if: needs.test.result != 'success' || needs.lint.result != 'success' || needs.lint-skills.result != 'success' || needs.adobepy_cli_floor.result != 'success' || needs.cli-smoke.result != 'success'
        run: exit 1
